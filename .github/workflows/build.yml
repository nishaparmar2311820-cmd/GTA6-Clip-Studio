
name: Build GTA6 Clip Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract project
        run: |
          mkdir -p source
          unzip -q GTA6_Android_Clip_Studio_Source.zip -d source

      - name: Find project
        run: |
          GRADLEW=$(find source -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "Gradle wrapper not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GTA6-Clip-Studio-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
